spring.datasource.url=jdbc:h2:mem:weather_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

spring.liquibase.enabled=false

session.expiration-hours=24

weather.api.key=test-key
weather.geo.url=http://localhost:8089/geo
weather.weather.url=http://localhost:8089/weather