<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Search Results</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<div class="container mt-5">

    <h2 class="mb-4">
        Search results for:
        <span th:text="${city}"></span>
    </h2>

    <div class="row">

        <div class="col-12 col-lg-4 col-md-6 mb-4"
             th:each="location : ${locations}">

            <div class="card h-100">

                <div class="card-body d-flex flex-column">

                    <!-- CITY -->

                    <h3 class="card-title"
                        th:text="${location.name}">
                        City
                    </h3>

                    <!-- COUNTRY -->

                    <p class="card-text">
                        Country:
                        <span th:text="${location.country}">
                            Country
                        </span>
                    </p>

                    <!-- STATE -->

                    <p class="card-text"
                       th:if="${location.state != null}">

                        State:
                        <span th:text="${location.state}">
                            State
                        </span>

                    </p>

                    <!-- LATITUDE -->

                    <p class="card-text">
                        Latitude:
                        <span th:text="${location.lat}">
                            0
                        </span>
                    </p>

                    <!-- LONGITUDE -->

                    <p class="card-text">
                        Longitude:
                        <span th:text="${location.lon}">
                            0
                        </span>
                    </p>

                    <!-- ADD BUTTON -->

                    <form method="post"
                          th:action="@{/locations}"
                          class="mt-auto">

                        <input type="hidden"
                               name="name"
                               th:value="${location.name}">

                        <input type="hidden"
                               name="latitude"
                               th:value="${location.lat}">

                        <input type="hidden"
                               name="longitude"
                               th:value="${location.lon}">

                        <button type="submit"
                                class="btn btn-success w-100">

                            Add

                        </button>

                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- BACK BUTTON -->

    <div class="mt-4">

        <a th:href="@{/index}"
           class="btn btn-outline-secondary">

            Back

        </a>

    </div>
</div>

</body>
</html>
